name: Backup to GitLab

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  gitlab:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # main and tags only, never forced and never deleted, so GitLab keeps history even if GitHub's is rewritten
      - name: Push main and tags
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          remote="https://oauth2:${GITLAB_TOKEN}@gitlab.com/althaser/website.git"
          git push "${remote}" refs/remotes/origin/main:refs/heads/main
          git push "${remote}" --tags
