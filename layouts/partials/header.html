<header
  class="nav flex flex-row items-center row py-2 px-2 mb-6 w-full rounded-sm border-b border-gray-700 bg-gray-200 dark:bg-nav-dark dark:border-gray-300 justify-between"
>
  <div class="nav-links">
    {{ range hugo.Data.nav }}
    {{ $active := cond (isset . "section") (eq $.Section .section) $.IsHome }}
    <a class="nav-menu-item {{ if $active }} active {{ end }}" href="{{ .section | default `/` | relURL }}" aria-label="{{ .title }}" title="{{ .title }}">
      {{ partial "icon.html" .icon }}
    </a>
    {{ end }}
  </div>

  <div class="flex items-center gap-1">
    <button
      type="button"
      class="nav-menu-item inline-flex items-center justify-center text-link dark:text-link-dark"
      data-theme-toggle
      aria-label="Toggle theme"
      title="Toggle theme"
    >
      {{ partial "icon-theme-toggle.html" }}
    </button>
  </div>
</header>
