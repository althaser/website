- id: blockchain
  label: Blockchain
  alt: Animated blockchain processing
  group: computing
  caption: "Peers gossip transactions into a Merkle tree, miners try nonces until the hash fits, and the new block joins the chain."
- id: diffusion
  label: Diffusion
  alt: Animated diffusion model generating an image
  group: computing
  caption: "Starting from pure noise, every denoising step reveals a little more, from coarse blocks to a sharp image."
- id: gpu
  label: GPU
  alt: Animated GPU parallel computing
  group: computing
  caption: "Data streams over PCIe and from VRAM into thousands of cores working in parallel to fill the output matrix C = A × B."
- id: kubernetes
  label: Kubernetes
  alt: Animated Kubernetes cluster
  group: computing
  caption: "The control plane schedules pods onto nodes, heartbeats keep it informed and the ingress routes traffic to them."
- id: llm
  label: LLM
  alt: Animated transformer language model
  group: computing
  caption: "Each token flows through attention and feed-forward layers, the softmax picks the next one and it joins the sequence."
- id: neural
  label: NeuralNetwork
  alt: Animated neural network
  group: computing
  caption: "A forward pass makes a prediction, backpropagation sends the error back, and the right answer grows more confident every epoch."
- id: quantum
  label: Quantum
  alt: Animated quantum circuit
  group: computing
  caption: "Qubits pass through gates and become entangled, then each measurement collapses them into bits that build up a histogram."
- id: riemann
  label: Riemann
  alt: Animated Riemann zeta function zeros on the critical line
  group: science
  caption: "Every zero of ζ on the critical line Re(s) = ½ adds a wave that sharpens the count of the prime numbers. The third graph shows ψ(x), a staircase that steps up at every prime (and prime power) up to x: the smooth curve is rebuilt from the zeros alone, and each new zero brings it closer to the exact steps."
- id: spacetime
  label: SpaceTime
  alt: Animated curved spacetime with an orbiting planet, bent light and its worldline
  group: astronomy
  caption: "Mass curves spacetime: a planet orbits inside the well, light bends past the star and every object follows its worldline."
- id: fourier
  label: Fourier
  alt: Animated Fourier series drawing a shape with epicycles, its spectrum and partial reconstructions
  group: science
  caption: "Spinning circles, one per frequency, add up to draw any closed shape, and a handful of the strongest already gets close."
- id: solarsystem
  label: SolarSystem
  alt: Animated solar system moving through space, the planets tracing helices around the Sun's path
  group: astronomy
  caption: "As the Sun travels through the galaxy, each planet traces a helix around its path."
- id: light
  label: Light
  alt: Animated light crossing from the Earth to the Moon, interfering through a double slit and ejecting electrons from a metal
  group: science
  caption: "Light covers the 384 400 km to the Moon in 1.28 s, interferes with itself like a wave through two slits, and arrives in packets of energy E = hf that knock electrons out of a metal."
- id: spectrum
  label: Spectrum
  alt: Animated electromagnetic spectrum from radio waves to gamma rays, with wavelengths, frequencies and the visible colours
  group: science
  caption: "From radio to gamma rays, every kind of light travels at the same speed; shorter waves mean higher frequency and more energy, and our eyes see only a thin slice."
- id: milkyway
  label: MilkyWay
  alt: Animated Milky Way seen from above, with its spiral arms, central bar and the Sun's position
  group: astronomy
  caption: "Our galaxy is a barred spiral about 100 000 light-years across; the Sun sits on a small spur between two arms, 26 000 light-years from the centre, and takes 230 million years to go round once."
- id: neutrinos
  label: Neutrinos
  alt: Animated neutrinos streaming from the Sun straight through the Earth, and one neutrino changing flavour as it travels
  group: science
  caption: "Neutrinos barely interact with matter: billions from the Sun cross every square centimetre of us each second, pass straight through the Earth, and switch between three flavours as they travel."
