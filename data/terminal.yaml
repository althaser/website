                    {yellow}DE{/}: GNOME 50.1
                    {yellow}Terminal{/}: ghostty
                    {yellow}CPU{/}: Intel Core Ultra 7 265H (16)
                    {yellow}Memory{/}: 17.24 GiB / 61.30 GiB (28%)

                    {red}███{/}{green}███{/}{yellow}███{/}{blue}███{/}{magenta}███{/}{cyan}███{/}{gray}███{/}

  - cmd: "pi \"what is althaser.me about?\""
    lineDelay: 120
    output: |
