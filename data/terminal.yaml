      {green}✓{/} {gray}fetched 30 pages{/}

      {yellow}althaser.me{/} is Pedro Beja's personal website: blog posts and
      some personal links about open source topics and other stuff he
      uses on a daily basis.

  - cmd: "sl"
    effect: sl

  - cmd: "pipes.sh"
    effect: pipes
    duration: 12000

  - cmd: "apt moo"
