    - "[  {green}OK{/}  ] Reached target multi-user.target - Multi-User System."
    - "[  {green}OK{/}  ] Started gdm.service - GNOME Display Manager."
    - "[  {green}OK{/}  ] Reached target graphical.target - Graphical Interface."
  issue: "Ubuntu 26.04.1 LTS laptop tty1"
  login: "laptop login: "
  user: "althaser"
  welcome: "Welcome to Ubuntu 26.04.1 LTS (GNU/Linux 7.0.0-43-generic x86_64)"
sessions:
  - cmd: "echo \"here goes some easter eggs\""
    interrupt: true

  - cmd: "hostname"
    output: |
      laptop

  - cmd: "uptime -p"
    output: |
      up 3 days, 7 hours, 42 minutes

  - cmd: "fastfetch --logo-type small"
    output: |
      {red}         _  {/}  {yellow}althaser{/}@{yellow}laptop{/}
      {red}     ---(_) {/}  ---------------
      {red} _/  ---  \ {/}  {yellow}OS{/}: Ubuntu 26.04.1 LTS x86_64
      {red}(_) |   |   {/}  {yellow}Kernel{/}: Linux 7.0.0-43-generic
      {red}  \  --- _/ {/}  {yellow}Uptime{/}: 3 days, 7 hours, 42 mins
      {red}     ---(_) {/}  {yellow}Shell{/}: bash 5.3.9
                    {yellow}DE{/}: GNOME 50.1
                    {yellow}Terminal{/}: ghostty
                    {yellow}CPU{/}: Intel Core Ultra 7 265H (16)
                    {yellow}Memory{/}: 17.24 GiB / 61.30 GiB (28%)

                    {red}███{/}{green}███{/}{yellow}███{/}{blue}███{/}{magenta}███{/}{cyan}███{/}{gray}███{/}

  - cmd: "pi \"what is althaser.me about?\""
    lineDelay: 120
    output: |
      {magenta}π{/} {gray}reading https://althaser.me ...{/}
      {green}✓{/} {gray}fetched 30 pages{/}

      {yellow}althaser.me{/} is Pedro Beja's personal website: blog posts and
      some personal links about open source topics and other stuff he
      uses on a daily basis.

  - cmd: "sl"
    effect: sl

  - cmd: "pipes.sh"
    effect: pipes
    duration: 12000

  - cmd: "apt moo"
